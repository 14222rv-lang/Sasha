
name: Build Sasha Chat APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        id: proj
        run: |
          if [ -f settings.gradle.kts ] && [ -d app ]; then
            DIR="."
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then echo "No project found"; exit 1; fi
            mkdir -p _src
            unzip -q "$ZIP" -d _src
            SETTINGS=$(find _src -name settings.gradle.kts | head -n 1)
            if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found inside $ZIP"; exit 1; fi
            DIR=$(dirname "$SETTINGS")
          fi
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK platform 35 and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sasha-Chat-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.proj.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
